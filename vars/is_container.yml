# vars/is_container.yml
# Disables rules that cannot meaningfully run inside a container.
# Loaded by tasks/main.yml when ansible_connection is a docker variant
# (system_is_container=true).
#
# Scope: kernel-level / hardware-level / boot-time / netfilter / mount-table /
# service-management rules. SSH cipher / PAM / SSSD / sudo config rules are
# container-safe even when their titles mention FIPS/audit and are NOT
# disabled here. Package-absence checks (rsh-server, telnet, nfs-kernel-server,
# ntp, systemd-timesyncd not installed) are also container-safe.

# ==============================================================================
# auditd service + audit subsystem (61 rules)
# ==============================================================================

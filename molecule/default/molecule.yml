---
# Molecule configuration for the Ubuntu 22.04 LTS STIG role
# https://molecule.readthedocs.io/en/latest/

dependency:
  name: galaxy
  options:
    requirements-file: collections/requirements.yml
driver:
  name: docker

platforms:
  - name: ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    # The image is multi-arch. Default keeps local Apple Silicon runs on arm64;
    # CI exports MOLECULE_DOCKER_PLATFORM=linux/amd64 because its runners are amd64.
    platform: "${MOLECULE_DOCKER_PLATFORM:-linux/arm64}"
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    command: "/lib/systemd/systemd"
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
      # Resolve the role itself by name (basename of MOLECULE_PROJECT_DIRECTORY).
      # Ansible's default search path doesn't include the role's parent dir, so
      # include_role by the role's own directory name fails without this hint.
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/molecule/default/roles"
  inventory:
    host_vars:
      ubuntu2204:
        # The audit and disruption settings live in converge.yml, whose play vars take
        # precedence over these host vars.
        ansible_become: false

verifier:
  name: ansible

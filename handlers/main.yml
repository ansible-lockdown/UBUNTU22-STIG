---

- name: Systemd_daemon_reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: Change_requires_reboot
  ansible.builtin.set_fact:
    reboot_required: true

- name: Update_grub
  ansible.builtin.command: update-grub
  changed_when: true
  failed_when: false

- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Restart_ssh

- name: Restart_ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  listen: Restart_ssh

- name: Restart_chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: Update_dconf
  ansible.builtin.command: dconf update
  changed_when: true
  failed_when: false

- name: Restart_gdm3
  ansible.builtin.systemd_service:
    name: gdm3
    state: restarted

- name: Restart_rsyslog
  ansible.builtin.systemd:
    name: rsyslog.service
    state: restarted

## Auditd tasks note order for handlers to run

- name: Auditd_immutable_check
  ansible.builtin.command: grep -c "^-e 2" /etc/audit/rules.d/audit.rules
  changed_when: false
  failed_when: discovered_auditd_immutable_check.rc not in [ 0, 1 ]
  register: discovered_auditd_immutable_check

- name: Audit_immutable_fact
  when:
    - discovered_auditd_immutable_check.stdout == '1'
  ansible.builtin.debug:
    msg: "Reboot required for auditd to apply new rules as immutable set"
  changed_when: false
  failed_when: false
  notify: Change_requires_reboot

- name: Restart_auditd
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: false
  failed_when: false

# pam-auth-update regenerates /etc/pam.d/common-* from the profiles in
# ubtu22stig_pam_confd_dir. --enable is used rather than --force: --force overrides the
# safety check that refuses to discard manual edits to the generated files, and discarding
# those silently is exactly the behaviour these controls are moving away from.
- name: Pam_auth_update_pwunix
  ansible.builtin.command: pam-auth-update --enable {{ ubtu22stig_pam_pwunix_file }}
  changed_when: true

- name: Pam_auth_update_pwfaillock
  ansible.builtin.command: pam-auth-update --enable {{ ubtu22stig_pam_faillock_file }} {{ ubtu22stig_pam_faillock_notify_file }}
  changed_when: true

- name: Pam_auth_update_pwfaildelay
  ansible.builtin.command: pam-auth-update --enable {{ ubtu22stig_pam_faildelay_file }}
  changed_when: true

# vlock ships /usr/lib/vlock/modules/nosysrq.so group-owned by vlock, and UBTU-22-412025 installs it
# after UBTU-22-232075 has already swept the library files, so the sweep is repeated here.
- name: Fix_library_file_group
  when:
    - ubtu22stig_232075
    - ubtu22stig_disruption_high
  ansible.builtin.shell: |
    set -o pipefail
    find /lib /usr/lib /lib64 /usr/lib64 -name '*.so*' ! -group root -type f -exec chgrp root '{}' \; -print
  args:
    executable: "{{ ubtu22stig_shell_executable }}"
  register: discovered_library_file_group_fix
  changed_when: discovered_library_file_group_fix.stdout | length > 0
  failed_when: discovered_library_file_group_fix.rc not in [ 0, 1 ]

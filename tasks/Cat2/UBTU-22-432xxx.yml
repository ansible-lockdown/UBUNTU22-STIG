---

- name: MEDIUM | UBTU-22-432010 | PATCH | Ubuntu 22.04 LTS must require users to reauthenticate for privilege escalation or when changing roles.
  when: ubtu22stig_432010
  tags:
    - UBTU-22-432010
    - CAT2
    - CCI-002038
    - SRG-OS-000373-GPOS-00156
    - SV-260558r1155216_rule
    - V-260558
    - NIST800-53R4_IA-11
    - sudo
  block:
    - name: MEDIUM | UBTU-22-432010 | AUDIT | Ubuntu 22.04 LTS must require users to reauthenticate for privilege escalation or when changing roles. | capture config
      ansible.builtin.shell: grep -Ei '!authenticate' /etc/sudoers /etc/sudoers.d/* 2>/dev/null | cut -d':' -f1
      changed_when: false
      failed_when: discovered_sudo_authenticate.rc not in [ 0, 1 ]
      register: discovered_sudo_authenticate

    - name: MEDIUM | UBTU-22-432010 | PATCH | Ubuntu 22.04 LTS must require users to reauthenticate for privilege escalation or when changing roles. | Remove !authenticate
      when:
        - discovered_sudo_authenticate.stdout_lines is defined
        - discovered_sudo_authenticate.stdout_lines | length > 0
        - ubtu22stig_disruption_high
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '!authenticate'
        replace: ''
      loop: "{{ discovered_sudo_authenticate.stdout_lines | unique }}"

- name: MEDIUM | UBTU-22-432011 | PATCH | Ubuntu 22.04 LTS must require users to provide a password for privilege escalation.
  when: ubtu22stig_432011
  tags:
    - UBTU-22-432011
    - CAT2
    - CCI-002038
    - SRG-OS-000396-GPOS-00176
    - SV-274860r1155210_rule
    - V-274860
    - NIST800-53R4_IA-11
    - sudo
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^([^#|{% if system_is_ec2 %}ec2-user{% endif %}].*)NOPASSWD(.*)'
    replace: '\1PASSWD\2'
    validate: '/usr/sbin/visudo -cf %s'
  loop: "{{ prelim_sudoers_files.stdout_lines }}"

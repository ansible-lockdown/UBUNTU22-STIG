---

- name: MEDIUM | UBTU-22-291010 | PATCH | Ubuntu 22.04 LTS must disable automatic mounting of Universal Serial Bus (USB) mass storage driver.
  when: ubtu22stig_291010
  tags:
    - UBTU-22-291010
    - CAT2
    - CCI-001958
    - CCI-003959
    - SRG-OS-000378-GPOS-00163
    - SV-260540r986276_rule
    - V-260540
    - NIST800-53R4_IA-3
    - hardware
  vars:
    blacklist: 'usb-storage'
  ansible.builtin.template:
    dest: "/etc/modprobe.d/{{ blacklist }}.conf"
    src: etc/modprobe.d/module.conf.j2
    mode: 'go-wx'
  notify: Change_requires_reboot

- name: MEDIUM | UBTU-22-291015 | PATCH | Ubuntu 22.04 LTS must disable all wireless network adapters.
  when: ubtu22stig_291015
  tags:
    - UBTU-22-291015
    - CAT2
    - CCI-002418
    - SRG-OS-000481-GPOS-00481
    - SV-260541r958358_rule
    - V-260541
    - NIST800-53R4_SC-8
    - hardware
  block:
    - name: MEDIUM | UBTU-22-291015 | PATCH | Ubuntu 22.04 LTS must disable all wireless network adapters. | Create modprobe.d file
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/{{ item }}.conf
        regexp: '^(#)?install true(\\s|$)'
        line: install {{ item }} true
        create: true
        mode: 'go-wx'
      loop: "{{ prelim_wireless_modules.stdout_lines }}"

    - name: MEDIUM | UBTU-22-291015 | PATCH | Ubuntu 22.04 LTS must disable all wireless network adapters. | blacklist
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/blacklist.conf
        regexp: "^(#)?blacklist {{ item }}(\\s|$)"
        line: "blacklist {{ item }}"
        create: true
        mode: 'go-wx'
      loop: "{{ prelim_wireless_modules.stdout_lines }}"

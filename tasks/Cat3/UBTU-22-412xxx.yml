---

- name: LOW | UBTU-22-412010 | PATCH | Ubuntu 22.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt.
  when: ubtu22stig_412010
  tags:
    - UBTU-22-412010
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00226
    - SV-260550r991588_rule
    - V-260550
    - NIST800-53R4_CM-6
    - account
    - pam
  block:
    # Earlier releases wrote this line into the generated /etc/pam.d/common-auth, where
    # pam-auth-update discards it and treats it as a local edit that blocks regeneration. The
    # faildelay profile below now supplies the line, separated by tabs, which this pattern does
    # not match.
    - name: LOW | UBTU-22-412010 | PATCH | Ubuntu 22.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. | remove superseded common-auth line
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^auth required pam_faildelay\.so delay=\d+$'
        state: absent

    - name: LOW | UBTU-22-412010 | PATCH | Ubuntu 22.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. | ensure faildelay profile
      ansible.builtin.template:
        src: "{{ ubtu22stig_pam_confd_dir }}{{ ubtu22stig_pam_faildelay_file }}.j2"
        dest: "/{{ ubtu22stig_pam_confd_dir }}{{ ubtu22stig_pam_faildelay_file }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      notify: Pam_auth_update_pwfaildelay

    - name: LOW | UBTU-22-412010 | AUDIT | Ubuntu 22.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. | check generated stack
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^auth\s+required\s+pam_faildelay\.so\s+delay={{ ubtu22stig_faildelay }}\s*$' /etc/pam.d/common-auth
      args:
        executable: "{{ ubtu22stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_pam_faildelay.rc not in [ 0, 1, 2 ]
      check_mode: false
      register: discovered_pam_faildelay

    # A host whose profile is already correct but whose generated file lacks the line would see
    # no template change, so nothing would notify the handler. Force the regeneration.
    - name: LOW | UBTU-22-412010 | PATCH | Ubuntu 22.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. | regenerate if missing
      when: discovered_pam_faildelay.stdout | length == 0
      ansible.builtin.debug:
        msg: "pam_faildelay delay={{ ubtu22stig_faildelay }} is missing from /etc/pam.d/common-auth; regenerating from the profile source"
      changed_when: true
      notify: Pam_auth_update_pwfaildelay

- name: LOW | UBTU-22-412020 | PATCH | Ubuntu 22.04 LTS must limit the number of concurrent sessions to ten for all accounts and/or account types.
  when: ubtu22stig_412020
  tags:
    - UBTU-22-412020
    - CAT3
    - CCI-000054
    - SRG-OS-000027-GPOS-00008
    - SV-260552r958398_rule
    - V-260552
    - NIST800-53R4_AC-10
    - account
    - pam
  block:
    - name: LOW | UBTU-22-412020 | AUDIT | Ubuntu 22.04 LTS must limit the number of concurrent sessions to ten for all accounts and/or account types. | find current settings
      ansible.builtin.find:
        paths: /etc/security
        contains: \* hard maxlogins
        recurse: true
        patterns: '*.conf'
        read_whole_file: true
      register: discovered_security_maxlogins

    - name: LOW | UBTU-22-412020 | PATCH | Ubuntu 22.04 LTS must limit the number of concurrent sessions to ten for all accounts and/or account types. | comment out settings
      when: "'/etc/security/limits.conf' not in item.path"
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: ^\* hard maxlogins
        line: '#* hard maxlogins'
      loop: "{{ discovered_security_maxlogins.files }}"

    - name: LOW | UBTU-22-412020 | PATCH | Ubuntu 22.04 LTS must limit the number of concurrent sessions to ten for all accounts and/or account types. | Ensure settings
      ansible.builtin.lineinfile:
        path: /etc/security/limits.conf
        regexp: ^\* hard maxlogins
        line: '* hard maxlogins {{ ubtu22stig_maxlogins }}'

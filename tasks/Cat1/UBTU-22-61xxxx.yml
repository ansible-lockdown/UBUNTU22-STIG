---

- name: HIGH | UBTU-22-611060 | PATCH | Ubuntu 22.04 LTS must not allow accounts configured with blank or null passwords.
  when: ubtu22stig_611060
  tags:
    - UBTU-22-611060
    - CAT1
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-260570r1082233_rule
    - V-260570
    - NIST800-53R4_CM-6
    - password
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: nullok
    replace: ''
  loop:
    - /etc/pam.d/common-auth
    - /etc/pam.d/common-password

- name: HIGH | UBTU-22-611065 | PATCH | Ubuntu 22.04 LTS must not have accounts configured with blank or null passwords.
  when: ubtu22stig_611065
  tags:
    - UBTU-22-611065
    - CAT1
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-260571r991589_rule
    - V-260571
    - NIST800-53R4_CM-6
    - password
  vars:
    warn_control_id: "HIGH | UBTU-22-611065"
  block:
    - name: HIGH | UBTU-22-611065 | PATCH | Ubuntu 22.04 LTS must not have accounts configured with blank or null passwords.
      when:
        - ubtu22stig_disruption_high
      ansible.builtin.user:
        name: "{{ item }}"
        password_lock: true
      loop: "{{ prelim_ubtu22stig_empty_password_accounts.stdout_lines }}"

    - name: HIGH | UBTU-22-611065 | WARN | Ubuntu 22.04 LTS must not have accounts configured with blank or null passwords.
      when:
        - not ubtu22stig_disruption_high
        - prelim_ubtu22stig_empty_password_accounts.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! The following accounts have blank passwords {{ prelim_ubtu22stig_empty_password_accounts.stdout_lines }} "

    - name: HIGH| UBTU-22-611065 | WARN | Ubuntu 22.04 LTS must not have accounts configured with blank or null passwords.
      when:
        - not ubtu22stig_disruption_high
        - prelim_ubtu22stig_empty_password_accounts.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: HIGH | UBTU-22-612040 | PATCH | Ensure /etc/pam_pkcs11/ directory exists for STIG scanner compliance (V-260579)
  when:
    - ubtu22stig_612040
    - ubtu22stig_disruption_high
  tags:
    - UBTU-22-612040
    - CAT1
    - CCI-000187
    - SRG-OS-000068-GPOS-00036
    - SV-260579r958452_rule
    - V-260579
    - NIST800-53R4_IA-5
    - multifactor
  ansible.builtin.file:
    path: /etc/pam_pkcs11
    state: directory
    owner: root
    group: root
    mode: 'go-w'

- name: HIGH | UBTU-22-612040 | PATCH | Create baseline /etc/pam_pkcs11/pam_pkcs11.conf if absent for STIG scanner compliance (V-260579)
  when:
    - ubtu22stig_612040
    - ubtu22stig_disruption_high
  tags:
    - UBTU-22-612040
    - CAT1
    - CCI-000187
    - SRG-OS-000068-GPOS-00036
    - SV-260579r958452_rule
    - V-260579
    - NIST800-53R4_IA-5
    - multifactor
  ansible.builtin.copy:
    dest: /etc/pam_pkcs11/pam_pkcs11.conf
    force: false
    owner: root
    group: root
    mode: 'go-w'
    content: |
      {{ file_managed_by_ansible }}
      # Baseline file for STIG V-260579 (UBTU-22-612040). Created when
      # /etc/pam_pkcs11/pam_pkcs11.conf is absent; pam-pkcs11 package may or
      # may not be installed. Adjust pkcs11_module path for the host arch
      # if pam-pkcs11 is later installed and used.
      pam_pkcs11 {
        use_mappers = pwent;
        use_pkcs11_module = opensc;
        pkcs11_module opensc {
          module = /usr/lib/x86_64-linux-gnu/opensc-pkcs11.so;
        }
        mapper pwent {
          module = internal;
        }
      }

- name: HIGH | UBTU-22-612040 | PATCH | Ubuntu 22.04 LTS must map the authenticated identity to the user or group account for PKI-based authentication.
  when:
    - ubtu22stig_612040
    - "'pam-pkcs11' in ansible_facts.packages"
  tags:
    - UBTU-22-612040
    - CAT1
    - CCI-000187
    - SRG-OS-000068-GPOS-00036
    - SV-260579r958452_rule
    - V-260579
    - NIST800-53R4_IA-5
    - multifactor
  ansible.builtin.lineinfile:
    path: /etc/pam_pkcs11/pam_pkcs11.conf
    regexp: '^[#\s]*use_mappers\s*='
    line: 'use_mappers = pwent'
